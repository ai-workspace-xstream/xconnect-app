name: Pull Request Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.*"
      - "go_core/**"
      - "linux/**"
      - "libXray"
      - ".gitmodules"
      - "scripts/ci/**"
      - ".github/actions/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.4
  GO_VERSION: "1.26.4"

jobs:
  verify:
    name: Flutter verification
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Flutter SDK
        uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go_core/go.sum

      - name: Install verification dependencies
        shell: bash
        run: bash ./scripts/ci/setup_platform_deps.sh linux

      - name: Check pinned libXray and Linux bridge
        shell: bash
        run: |
          bash scripts/ci/check_libxray_contract.sh
          cd go_core
          go vet ./...
          go test -mod=readonly -count=1 -run 'TunnelGovernor' .

      - name: Run Flutter verification suite
        shell: bash
        run: bash ./scripts/ci/run_flutter_ci_suite.sh

      - name: Generate business DNS runtime fixture
        shell: bash
        env:
          XCONNECT_BUSINESS_DNS_FIXTURE: ${{ runner.temp }}/business-dns-fixture.json
        run: flutter test test/services/business_dns_policy_test.dart

      - name: Verify business DNS with pinned Xray core
        shell: bash
        working-directory: go_core
        env:
          XCONNECT_BUSINESS_DNS_FIXTURE: ${{ runner.temp }}/business-dns-fixture.json
        run: go test -mod=readonly -v ../test/integration/business_dns_runtime_test.go
