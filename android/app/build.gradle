plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Resolve version from pubspec.yaml when flutter extension lacks it
def pubspecFile = new File(rootProject.projectDir, "pubspec.yaml")
def versionNameDefault = "1.0.0"
def versionCodeDefault = 1
if (pubspecFile.exists()) {
    def matcher = (pubspecFile.text =~ /version:\s*([0-9.]+)(?:\+([0-9]+))?/)
    if (matcher.find()) {
        versionNameDefault = matcher.group(1)
        if (matcher.groupCount() > 1 && matcher.group(2)) {
            versionCodeDefault = matcher.group(2).toInteger()
        }
    }
}
def flutterExt = project.extensions.findByName("flutter")
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("key.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace = "plus.svc.xconnect"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "plus.svc.xconnect"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = (flutterExt?.metaClass?.respondsTo(flutterExt, "getVersionCode") ? flutterExt.getVersionCode() : versionCodeDefault)
        versionName = (flutterExt?.metaClass?.respondsTo(flutterExt, "getVersionName") ? flutterExt.getVersionName() : versionNameDefault)

        externalNativeBuild {
            cmake {
                // NDK 28 on macOS cannot link CMake's compiler probe
                // executable during Android Studio/Gradle configuration.
                // A static probe keeps configuration deterministic; the JNI
                // shared library still links normally in the actual build.
                arguments "-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]
                storeFile file(signingProperties["storeFile"])
                storePassword signingProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // CI release lanes materialize key.properties from Vault. Local
            // verification builds use debug signing when no keystore is set.
            signingConfig = signingPropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
