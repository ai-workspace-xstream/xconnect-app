name: xconnect
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: XConnect Team <support@svc.plus>
description: |
  XConnect Linux desktop client with System Tunnel support for GNOME and KDE.
homepage: https://svc.plus
license: Proprietary
contents:
  - src: ./dist/linux/package-root/opt/xconnect/
    dst: /opt/xconnect
    type: tree
  - src: ./dist/linux/package-root/usr/share/applications/xconnect.desktop
    dst: /usr/share/applications/xconnect.desktop
  - src: ./dist/linux/package-root/usr/share/icons/hicolor/256x256/apps/xconnect.png
    dst: /usr/share/icons/hicolor/256x256/apps/xconnect.png
  - src: ./dist/linux/package-root/usr/libexec/xconnect/xconnect-net-helper
    dst: /usr/libexec/xconnect/xconnect-net-helper
    file_info:
      mode: 0755
  - src: ./dist/linux/package-root/usr/share/polkit-1/actions/org.xconnect.policy
    dst: /usr/share/polkit-1/actions/org.xconnect.policy
  - src: ./dist/linux/package-root/etc/ld.so.conf.d/xconnect.conf
    dst: /etc/ld.so.conf.d/xconnect.conf
overrides:
  deb:
    depends:
      - "libgtk-3-0t64 | libgtk-3-0"
      - "pkexec | policykit-1"
      - iproute2
      - libcap2-bin
      - libx11-6
      - libstdc++6
    recommends:
      - libnotify-bin
  rpm:
    depends:
      - "(gtk3 or libgtk-3-0)"
      - polkit
      - "(iproute or iproute2)"
      - "(libcap or libcap-progs)"
      - "(libX11 or libX11-6)"
      - "(libstdc++ or libstdc++6)"
    recommends:
      - "(libnotify or libnotify-tools)"
scripts:
  postinstall: ./packaging/nfpm/postinstall.sh
  postremove: ./packaging/nfpm/postremove.sh
