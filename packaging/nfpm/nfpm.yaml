name: xconnect
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: XConnect Team <support@svc.plus>
description: |
  XConnect Linux desktop client with proxy mode by default and optional tunnel mode.
homepage: https://svc.plus
license: Proprietary
contents:
  - src: ./dist/linux/package-root/opt/xconnect/
    dst: /opt/xconnect
    type: tree
  - src: ./dist/linux/package-root/usr/share/applications/xconnect.desktop
    dst: /usr/share/applications/xconnect.desktop
  - src: ./dist/linux/package-root/usr/share/icons/hicolor/256x256/apps/xconnect.png
    dst: /usr/share/icons/hicolor/256x256/apps/xconnect.png
  - src: ./dist/linux/package-root/usr/libexec/xconnect/xconnect-net-helper
    dst: /usr/libexec/xconnect/xconnect-net-helper
    file_info:
      mode: 0755
  - src: ./dist/linux/package-root/usr/share/polkit-1/actions/org.xconnect.policy
    dst: /usr/share/polkit-1/actions/org.xconnect.policy
overrides:
  deb:
    depends:
      - libayatana-appindicator3-1
      - libnotify-bin
      - policykit-1
      - iproute2
  rpm:
    depends:
      - libappindicator-gtk3
      - libnotify
      - polkit
      - iproute
scripts:
  postinstall: ./packaging/nfpm/postinstall.sh
